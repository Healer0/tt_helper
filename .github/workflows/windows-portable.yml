name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline checks
        run: python selfcheck.py
      - name: Check diagnostic input guards without sending input
        if: hashFiles('tools/poc/test_poc.py') != ''
        run: python -m unittest tools.poc.test_poc
      - name: Build public source archive
        run: python build_release.py
      - name: Build and check Windows portable archive
        run: python build_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: tt_fish-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
